name: History snapshot QA

on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'historySnapshot.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/history-snapshot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Recompute lockfile for audit only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit deterministic lockfile snapshot for palmoni5 PR update
        if: matrix.node == '22'
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const raw = fs.readFileSync('package-lock.json');
          const text = raw.toString('base64');
          console.log('AUDIT_LOCK_BEGIN=' + raw.length);
          for (let i = 0; i < text.length; i += 2048) {
            console.log('AUDIT_LOCK_CHUNK_' + String(i / 2048).padStart(4, '0') + '=' + text.slice(i, i + 2048));
          }
          console.log('AUDIT_LOCK_END=' + require('node:crypto').createHash('sha256').update(raw).digest('hex'));
          JS
      - run: npm ci
      - name: History semantic and ordering regressions
        run: npm test
      - name: TypeScript static analysis
        run: npm run lint
      - name: Production bundle
        run: npm run build
